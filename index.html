<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>แก๊งคอลเซ็นเตอร์ – ตำรวจภูพิงคราชนิเวศน์ช่วยทัน!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --bar:#e9e9e9; --ink:#141414; --muted:#5b5b5b;
  --red:#e63946; --line:#d4d4d4; --ph:#eeeeee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif Thai",Georgia,serif;line-height:1.9}

.bar{background:var(--bar);text-align:center;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.logo{display:inline-block;text-decoration:none;color:var(--ink)}
.logo b{display:block;font:600 clamp(30px,5.5vw,46px)/1.3 Mitr,sans-serif;letter-spacing:.5px;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
.logo b span{color:var(--red);font-size:1.3em;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:3px}

.story{max-width:1100px;margin:0 auto;padding:32px 20px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}

/* ---- ปรับแกลเลอรีให้เป็น Slider เลื่อนดูทีละภาพ ---- */
.gallery {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  gap: 16px;
  padding-bottom: 12px;
  scroll-behavior: smooth;
}
.gallery .f {
  flex: 0 0 100%;
  scroll-snap-align: center;
  margin: 0;
}
.gallery::-webkit-scrollbar {
  height: 6px;
}
.gallery::-webkit-scrollbar-track {
  background: var(--bar);
  border-radius: 8px;
}
.gallery::-webkit-scrollbar-thumb {
  background: var(--red);
  border-radius: 8px;
}

.ph{aspect-ratio:4/3;margin:0;position:relative;overflow:hidden;background:var(--ph)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.gallery figcaption{font:400 13px/1.5 Mitr,sans-serif;color:var(--muted);margin-top:6px}

.text{text-align:center}
.tag{display:inline-block;font:500 14px/1 Mitr,sans-serif;color:#fff;background:var(--red);padding:6px 12px;margin-bottom:14px}
h1{font:600 clamp(34px,5vw,58px)/1.25 Mitr,sans-serif;margin:0 0 14px}
.sub{font:500 clamp(20px,2.6vw,28px)/1.45 Mitr,sans-serif;margin:0 0 18px}
.meta{font:400 14px/1.6 Mitr,sans-serif;color:var(--muted);padding:10px 0;border-block:1px solid var(--line);margin:0 0 22px}
.lead{font-size:clamp(18px,2vw,21px);margin:0}

.body{grid-column:1/-1;max-width:680px;margin:8px auto 0;font-size:18px}
.body p{margin:0 0 1.2em}
.body h2{font:500 22px/1.5 Mitr,sans-serif;margin:1.8em 0 .5em}
.quote{border-left:4px solid var(--red);padding:2px 0 2px 18px;margin:1.6em 0;font:500 20px/1.7 Mitr,sans-serif}
.quote small{display:block;font:400 14px/1.6 Mitr,sans-serif;color:var(--muted);margin-top:6px}
sup a{color:var(--red);text-decoration:none;font-family:Mitr,sans-serif}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:1.6em 0;text-align:center}
.facts div{border:1px solid var(--line);padding:14px 6px}
.facts b{display:block;font:600 26px/1.3 Mitr,sans-serif;color:var(--red)}
.facts span{font:400 14px/1.4 Mitr,sans-serif;color:var(--muted)}

.poster{margin:2em 0}
.poster img{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;border:1px solid var(--line); border-radius: 8px;}
.poster figcaption{font:400 13px/1.5 Mitr,sans-serif;color:var(--muted);text-align:center;margin-top:8px}

.note{border:1px solid var(--line);border-left:4px solid var(--red);background:#fafafa;padding:14px 18px;margin:1.6em 0;font:400 15px/1.8 Mitr,sans-serif}
.note b{font-weight:500}

.refs{font:400 13px/1.7 Mitr,sans-serif;color:var(--muted);border-top:1px solid var(--line);margin-top:2em;padding-top:12px}
.refs p{margin:0 0 .4em!important}
.tags{font:400 14px/1.8 Mitr,sans-serif;color:var(--muted);margin-top:1.4em}
footer{border-top:1px solid var(--line);text-align:center;padding:22px;font:400 14px Mitr,sans-serif;color:var(--muted)}

@media (max-width:560px){.facts b{font-size:21px}}
@media (max-width:820px){.story{grid-template-columns:1fr;gap:24px}.text{order:-1}}

/* ---- v3 ---- */
.bar{position:relative}
.text{text-align:left}.text .tag,.text h1,.text .meta{text-align:center}
.text h1{font-size:clamp(24px,3vw,36px);line-height:1.45;margin-bottom:14px}
.lead{text-align:left;font-size:17px;line-height:1.9}
.body a{color:inherit;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.body sup a{text-decoration:none}
.poster figcaption{text-align:left;font-size:14px;line-height:1.7}
.menu-btn{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:var(--red);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border-radius:8px}
.menu-btn span{display:block;width:24px;height:2.5px;background:#fff;border-radius:2px}
.menu-btn:focus-visible,.drawer a:focus-visible,.drawer .x:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);background:#fff;z-index:50;transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 16px;box-shadow:2px 0 16px rgba(0,0,0,.15)}
.open .drawer{transform:none;visibility:visible}
.drawer .x{display:block;margin:0 12px 8px auto;width:44px;height:44px;border:0;background:transparent;font:400 24px/1 Mitr,sans-serif;cursor:pointer;color:var(--ink)}
.drawer a{display:block;padding:14px 24px;font:500 18px/1.4 Mitr,sans-serif;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.drawer a:hover,.drawer a[aria-current="page"]{background:#f3f3f3;color:var(--red)}
.about{max-width:1100px;margin:0 auto;padding:48px 20px;min-height:50vh}
.about h1{font:600 clamp(30px,5vw,46px)/1.3 Mitr,sans-serif;margin:0}

/* ---- v4: video / comment / about ---- */
.about h1{text-align:center}
.lede{text-align:center;font:400 16px/1.8 Mitr,sans-serif;color:var(--muted);margin:10px 0 0}
.vwrap{max-width:860px;margin:28px auto 0}
.vframe{position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#111; box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
.vframe video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;}
.vctl{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 22px;background:var(--bar);border-radius:32px;padding:15px 18px;margin-top:14px}
.sid{display:inline-block;font:400 15px/1 Mitr,sans-serif;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:10px 20px; background: transparent; cursor: pointer; transition: 0.2s;}
.sid:hover, .sid:focus{background: var(--red); color: white;}
[hidden]{display:none!important}
</style>
</head>

<div class="scrim" id="scrim" hidden></div>

</nav>
